function slug(name) {
  return name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

function fb() { return window.__firebase; }

async function loadAll() {
  if (!fb() || !fb().dbReady || !accessCode) return;
  try {
    const snap = await fb().getDocs(fb().collection(fb().db, "codes", accessCode, "umas"));
    umas = {};
    snap.forEach(d => umas[d.id] = d.data());
  } catch(e) {
    console.error("Erreur de chargement Firestore", e);
    setStatus("erreur de chargement");
  }
}

async function saveUma(id) {
  if (!fb() || !fb().dbReady || !accessCode) { setStatus("stockage non configuré"); return; }
  setStatus("sauvegarde...");
  try {
    await fb().setDoc(fb().doc(fb().db, "codes", accessCode, "umas", id), umas[id]);
    setStatus("✓ sauvegardé");
    setTimeout(()=>setStatus(""), 1200);
  } catch(e) {
    console.error(e);
    setStatus("erreur de sauvegarde");
  }
}

function setStatus(t) { const s = el("status"); if (s) s.textContent = t; }

function render() {
  if (!accessCode) { renderCodeGate(); return; }
  const root = app();
  root.innerHTML = `
    <div class="topnav">

      <div class="nav-spacer"></div>
      <span id="status"></span>
      <button class="ghost" onclick="changeCode()">Changer de code</button>
    </div>
    ${!fb() || !fb().dbReady ? `<div class="warn-banner">⚠️ Firebase n'est pas encore configuré dans le fichier (config vide). Les données ne seront pas sauvegardées tant que tu n'as pas collé ta config Firebase en haut du fichier HTML.</div>` : ""}
    <div id="view"></div>
  `;
  if (view === "home") renderHome();

}

function renderCodeGate() {
  app().innerHTML = `
    <div style="max-width:420px;margin:60px auto;text-align:center;">
      <h1>🏆 Uma Wiki Perso</h1>
      <p style="color:var(--muted);font-size:0.9rem;">Entre ton code d'accès perso. Le même code sur n'importe quel navigateur retrouve tes données.</p>
      <div class="field" style="text-align:left;">
        <label>Code d'accès</label>
        <input type="text" id="codeInput" placeholder="ex: vega-derby-42" style="width:100%">
      </div>
      <button onclick="submitCode()" style="width:100%;margin-top:8px;">Valider</button>
    </div>
  `;
  el("codeInput").addEventListener("keydown", e => { if (e.key==="Enter") submitCode(); });
}

window.submitCode = async function() {
  const v = el("codeInput").value.trim();
  if (!v) return;
  accessCode = v;
  localStorage.setItem("uma_wiki_code", v);
  await loadAll();
  render();
};

window.changeCode = function() {
  if (!confirm("Changer de code va recharger une autre base de données. Continuer ?")) return;
  accessCode = "";
  localStorage.removeItem("uma_wiki_code");
  umas = {};
  view = "home";
  render();
};

window.goHome = function() { view = "home"; render(); };

function renderHome() {

  const cards = Object.entries(umas).map(([id,u]) => {
    const trophyCount = Object.values(u.trophies||{}).filter(Boolean).length;
    const pct = RACES.length ? Math.round(trophyCount/RACES.length*100) : 0;
    const color = u.color || "#4a6fa5";
    const thumb = u.imageUrl
      ? `<img src="${escapeHtml(u.imageUrl)}" onerror="this.style.display='none'">`
      : (u.name||"?").slice(0,2).toUpperCase();
    return `
      <div class="uma-card" onclick="openUma('${id}')">
        <div class="thumb" style="background:${color}">${thumb}</div>
        <div class="info">
          <div class="name">${escapeHtml(u.name)}</div>
          <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
          <div class="mini-label">${trophyCount}/${RACES.length} trophées</div>
        </div>
      </div>
    `;
  }).join("");
  v.innerHTML = `
    <div class="home-grid">
      ${cards}
      <div class="add-card" onclick="openAddModal()">+ Ajouter une Uma</div>
    </div>
  `;
}

window.openAddModal = function() {
  showModal(`
    <h2>Nouvelle Uma</h2>
    <div class="field"><label>Nom</label><input type="text" id="newName" style="width:100%" placeholder="ex: Admire Vega"></div>
    <div class="field"><label>Couleur principale</label><input type="color" id="newColor" value="#4a6fa5"></div>
  `, () => {
    const name = el("newName").value.trim();
    if (!name) return false;
    const id = slug(name) + "-" + Date.now().toString(36).slice(-4);
    umas[id] = {
      name, color: el("newColor").value, imageUrl: "",
      stats: {speed:0,stamina:0,power:0,guts:0,wit:0},
      aptitudes: {turf:"G",dirt:"G",short:"G",mile:"G",medium:"G",long:"G",front:"G",pace:"G",late:"G",end:"G"},
      trophies: {}, notes: ""
    };
    saveUma(id);
    currentId = id; view = "sheet"; sheetTab = "stats";
    render();
    return true;
  });
};

window.openUma = function(id) { currentId = id; view = "sheet"; sheetTab = "stats"; render(); };

function renderSheet() {
  const u = umas[currentId];
  if (!u) { view = "home"; render(); return; }
  const v = el("view");
  const thumb = u.imageUrl
    ? `<img src="${escapeHtml(u.imageUrl)}" onerror="this.style.display='none'">`
    : (u.name||"?").slice(0,2).toUpperCase();
  v.innerHTML = `
    <div class="sheet-header">
      <div class="sheet-thumb" style="background:${u.color||'#4a6fa5'}">${thumb}</div>
      <div><div class="sheet-title">${escapeHtml(u.name)}</div></div>
      <div class="sheet-actions">
        <button class="secondary" onclick="openEditModal()">Modifier</button>
        <button class="ghost" onclick="deleteUma()">Supprimer</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${sheetTab==='stats'?'active':''}" onclick="switchTab('stats')">📊 Stats</div>
      <div class="tab ${sheetTab==='trophies'?'active':''}" onclick="switchTab('trophies')">🏆 Trophées</div>
      <div class="tab ${sheetTab==='notes'?'active':''}" onclick="switchTab('notes')">📝 Notes</div>
    </div>
    <div class="panel" id="tabPanel"></div>
  `;
  renderTabPanel();
}

window.switchTab = function(t) { sheetTab = t; renderSheet(); };

function renderTabPanel() {
  const u = umas[currentId];
  const p = el("tabPanel");
  if (sheetTab === "stats") {
    const s = u.stats || {};
    const statNames = {speed:"Vitesse",stamina:"Endurance",power:"Puissance",guts:"VE",wit:"Sagesse"};
    const statRows = Object.entries(statNames).map(([k,label]) => {
      const val = s[k]||0;
      return `<div class="stat-row"><div class="stat-name">${label}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.min(val/1200*100,100)}%"></div></div><div class="stat-val">${val}</div></div>`;
    }).join("");
    const a = u.aptitudes || {};
    const aptNames = {turf:"Turf",dirt:"Dirt",short:"Sprint",mile:"Mile",medium:"Medium",long:"Long",front:"Front",pace:"Pace",late:"Late",end:"End"};
    const aptBadges = Object.entries(aptNames).map(([k,label]) => {
      const letter = a[k]||"G";
      return `<div class="apt-badge apt-${letter}"><div class="apt-label">${label}</div>${letter}</div>`;
    }).join("");
    p.innerHTML = `${statRows}<div class="apt-grid">${aptBadges}</div>`;
  } else if (sheetTab === "trophies") {
    renderTrophyPanel(p);
  } else if (sheetTab === "notes") {
    p.innerHTML = `
      <div class="field"><label>Notes perso (lore, avis, favoris...)</label><textarea id="notesArea" rows="10">${escapeHtml(u.notes||"")}</textarea></div>
      <button onclick="saveNotes()">Enregistrer les notes</button>
    `;
  }
}

window.saveNotes = function() {
  umas[currentId].notes = el("notesArea").value;
  saveUma(currentId);
};

function renderTrophyPanel(p) {
  const u = umas[currentId];
  const doneMap = u.trophies || {};
  let filtered = RACES.filter(r => {
    if (filterTrack !== "all" && r.t !== filterTrack) return false;
    if (filterGrade !== "all" && r.g !== filterGrade) return false;
    if (filterDone === "todo" && doneMap[r.n]) return false;
    return true;
  });
  const totalCount = RACES.length;
  const doneCount = RACES.filter(r => doneMap[r.n]).length;

  let html = `
    <div class="progress-wrap">
      <div class="progress-label">${doneCount} / ${totalCount} trophées obtenus</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${totalCount?doneCount/totalCount*100:0}%"></div></div>
    </div>
    <div class="filters">
      <span class="chip ${filterTrack==='all'?'active':''}" onclick="setFilter('track','all')">Tout</span>
      <span class="chip ${filterTrack==='Turf'?'active':''}" onclick="setFilter('track','Turf')">🌱 Turf</span>
      <span class="chip ${filterTrack==='Dirt'?'active':''}" onclick="setFilter('track','Dirt')">🟤 Dirt</span>
      <span class="chip ${filterGrade==='all'?'active':''}" style="margin-left:14px" onclick="setFilter('grade','all')">Tous grades</span>
      <span class="chip ${filterGrade==='G1'?'active':''}" onclick="setFilter('grade','G1')">G1</span>
      <span class="chip ${filterGrade==='G2'?'active':''}" onclick="setFilter('grade','G2')">G2</span>
      <span class="chip ${filterGrade==='G3'?'active':''}" onclick="setFilter('grade','G3')">G3</span>
      <span class="chip ${filterDone==='all'?'active':''}" style="margin-left:14px" onclick="setFilter('done','all')">Tout afficher</span>
      <span class="chip ${filterDone==='todo'?'active':''}" onclick="setFilter('done','todo')">Manquantes</span>
    </div>
  `;

  if (filtered.length === 0) {
    html += `<div class="empty-msg">Aucune course ne correspond aux filtres 🎉</div>`;
  } else {
    TRACK_ORDER.forEach(track => {
      const trackRaces = filtered.filter(r => r.t === track);
      if (trackRaces.length === 0) return;
      html += `<div class="track-section"><div class="track-header ${track.toLowerCase()}">${track==="Turf"?"🌱 ":"🟤 "}${track}</div>`;
      DIST_ORDER.forEach(dist => {
        const distRaces = trackRaces.filter(r => r.d === dist).sort((a,b)=> a.g > b.g ? 1 : -1);
        if (distRaces.length === 0) return;
        const doneInDist = distRaces.filter(r => doneMap[r.n]).length;
        html += `<div class="dist-group"><div class="dist-title">${dist} (${doneInDist}/${distRaces.length})</div><div class="race-grid">`;
        distRaces.forEach(r => {
          const isDone = !!doneMap[r.n];
          html += `<div class="race-card ${isDone?'done':''}" onclick="toggleRace('${escapeAttr(r.n)}')"><input type="checkbox" ${isDone?"checked":""}><span class="race-name">${escapeHtml(r.n)}</span><span class="grade-badge ${r.g}">${r.g}</span></div>`;
        });
        html += `</div></div>`;
      });
      html += `</div>`;
    });
  }
  p.innerHTML = html;
}

window.setFilter = function(type, val) {
  if (type==="track") filterTrack = val;
  if (type==="grade") filterGrade = val;
  if (type==="done") filterDone = val;
  renderTabPanel();
};

window.toggleRace = function(name) {
  const u = umas[currentId];
  if (!u.trophies) u.trophies = {};
  u.trophies[name] = !u.trophies[name];
  renderTabPanel();
  saveUma(currentId);
};

window.openEditModal = function() {
  const u = umas[currentId];
  const s = u.stats||{}, a = u.aptitudes||{};
  showModal(`
    <h2>Modifier ${escapeHtml(u.name)}</h2>
    <div class="field"><label>Nom</label><input type="text" id="editName" style="width:100%" value="${escapeAttr(u.name)}"></div>
    <div class="field-row">
      <div class="field"><label>Couleur</label><input type="color" id="editColor" value="${u.color||'#4a6fa5'}"></div>
      <div class="field" style="flex:2"><label>URL image (perso)</label><input type="text" id="editImg" style="width:100%" value="${escapeAttr(u.imageUrl||'')}" placeholder="https://..."></div>
    </div>
    <div class="field-row">
      ${["speed","stamina","power","guts","wit"].map(k=>`
        <div class="field"><label>${({speed:"Vitesse",stamina:"Endurance",power:"Puissance",guts:"VE",wit:"Sagesse"})[k]}</label>
        <input type="number" id="stat_${k}" value="${s[k]||0}" style="width:100%"></div>
      `).join("")}
    </div>
    <div class="field-row">
      ${["turf","dirt","short","mile","medium","long","front","pace","late","end"].map(k=>`
        <div class="field"><label>${({turf:"Turf",dirt:"Dirt",short:"Sprint",mile:"Mile",medium:"Medium",long:"Long",front:"Front",pace:"Pace",late:"Late",end:"End"})[k]}</label>
        <select id="apt_${k}" style="width:100%">${APT_LETTERS.map(l=>`<option ${a[k]===l?'selected':''}>${l}</option>`).join("")}</select></div>
      `).join("")}
    </div>
  `, () => {
    const name = el("editName").value.trim();
    if (!name) return false;
    u.name = name;
    u.color = el("editColor").value;
    u.imageUrl = el("editImg").value.trim();
    u.stats = {};
    ["speed","stamina","power","guts","wit"].forEach(k => u.stats[k] = parseInt(el("stat_"+k).value)||0);
    u.aptitudes = {};
    ["turf","dirt","short","mile","medium","long","front","pace","late","end"].forEach(k => u.aptitudes[k] = el("apt_"+k).value);
    saveUma(currentId);
    render();
    return true;
  });
};

window.deleteUma = function() {
  if (!confirm(`Supprimer ${umas[currentId].name} ? (irréversible)`)) return;
  delete umas[currentId];
  view = "home";
  render();
};

function showModal(bodyHtml, onSave) {
  const wrap = document.createElement("div");
  wrap.className = "modal-backdrop";
  wrap.innerHTML = `<div class="modal">${bodyHtml}<div class="modal-actions"><button class="ghost" id="modalCancel">Annuler</button><button id="modalSave">Enregistrer</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("#modalCancel").onclick = () => wrap.remove();
  wrap.querySelector("#modalSave").onclick = () => { if (onSave()) wrap.remove(); };
}

function escapeHtml(s) { return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/`/g,"&#96;"); }

window.addEventListener("firebase-ready", async () => {
  if (accessCode) await loadAll();
  render();
});
setTimeout(() => { if (!document.getElementById("view") && !document.getElementById("codeInput")) render(); }, 800);
</script>
</body>
</html>
